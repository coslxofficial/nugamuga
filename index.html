<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gun Mayhem 2</title>
<style>
  :root { --b: clamp(64px, 17vh, 92px); --gap: 12px; --pad: 18px; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:system-ui,sans-serif; }
  #game { position:absolute; top:0; bottom:0; left:0; width:100%; }
  #game ruffle-player, #game ruffle-embed { width:100%; height:100%; }
  #demo { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:#5d6b82; text-align:center;
    background:linear-gradient(#1b2a45,#0d1424); font-size:15px; }
  #demo b { color:#9fb3d6; font-size:20px; display:block; margin-bottom:6px; }
  #log { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:20; color:#ffe14d; font:700 14px monospace;
    background:rgba(0,0,0,.5); padding:4px 10px; border-radius:8px; display:none; pointer-events:none; }

  .btn { position:absolute; z-index:10; touch-action:none; box-sizing:border-box; border-radius:50%;
    border:2px solid rgba(255,255,255,.55); color:#fff; opacity:.85;
    background:rgba(20,24,32,.45); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font:800 12px/1 system-ui,sans-serif; letter-spacing:.06em; text-shadow:0 1px 3px rgba(0,0,0,.7);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    transition:transform .05s, box-shadow .05s, filter .05s; }
  .btn svg { width:44%; height:44%; margin-bottom:3px; fill:#fff; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  .btn .k { position:absolute; top:6%; right:8%; font-size:11px; background:rgba(255,255,255,.18); padding:2px 5px; border-radius:5px; letter-spacing:0; }
  .btn.on { transform:scale(.93); background:rgba(255,255,255,.38); border-color:#fff; }

  /* Sol: ◀ ▶ (tek parça şerit, parmak kayabilir) */
  #mv { position:absolute; z-index:10; touch-action:none; display:flex; gap:var(--gap);
    left:calc(env(safe-area-inset-left,0px) + var(--pad)); bottom:calc(env(safe-area-inset-bottom,0px) + 20px); }
  #mv .btn { position:relative; width:calc(var(--b)*1.05); height:calc(var(--b)*1.05); border-radius:26%; }
  #mv .btn svg { width:48%; height:48%; margin:0; }
  #lf svg { transform:rotate(-90deg); } #rt svg { transform:rotate(90deg); }

  #dn { width:calc(var(--b)*.62); height:calc(var(--b)*.62); border-radius:24%;
    left:calc(env(safe-area-inset-left,0px) + var(--pad) + var(--b)*1.05 + var(--gap)/2 - var(--b)*.31);
    bottom:calc(env(safe-area-inset-bottom,0px) + 20px + var(--b)*1.05 + 14px); }
  #dn svg { transform:rotate(180deg); margin:0; width:50%; height:50%; }

  /* Sağ: ATEŞ / ZIPLA / DİNAMİT */
  :root { --R: calc(env(safe-area-inset-right,0px) + var(--pad)); --B: calc(env(safe-area-inset-bottom,0px) + 20px); }
  #fire { width:calc(var(--b)*1.15); height:calc(var(--b)*1.15); right:var(--R); bottom:var(--B); }
  #jump { width:calc(var(--b)*1.15); height:calc(var(--b)*1.15);
    right:calc(var(--R) + var(--b)*1.15 + var(--gap)); bottom:var(--B); }
  #dyn { width:calc(var(--b)*.9); height:calc(var(--b)*.9);
    right:calc(var(--R) + var(--b)*.12); bottom:calc(var(--B) + var(--b)*1.15 + 14px); }
  #jump svg { transform:none; }

  /* ?jump=left → ZIPLA sol tarafta (◀ ▶ nın üstünde) */
  body.jl #jump { right:auto; left:calc(env(safe-area-inset-left,0px) + var(--pad) + var(--b)*.4);
    bottom:calc(var(--B) + var(--b)*1.05 + 16px); }
  body.jl #dn { display:none; }
  body.jl #dyn { right:calc(var(--R) + var(--b)*1.15 + var(--gap)); bottom:var(--B); }

  /* MOD menü tuşu (sol üst) */
  #modbtn { position:absolute; z-index:30; touch-action:none; box-sizing:border-box;
    left:calc(env(safe-area-inset-left,0px) + 10px); top:calc(env(safe-area-inset-top,0px) + 6px);
    min-width:62px; height:32px; padding:0 12px; border-radius:16px; border:2px solid rgba(255,255,255,.7);
    background:rgba(122,44,255,.85); color:#fff; font:800 13px/28px system-ui,sans-serif; letter-spacing:.08em; text-align:center; }
  #modbtn.on { background:rgba(220,40,60,.9); }
  /* menü açıkken oyun tuşlarını gizle ki menüye dokunuş engellenmesin */
  body.modopen #mv, body.modopen #dn, body.modopen #jump, body.modopen #dyn, body.modopen #fire { display:none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="demo"><div><b>Önizleme (oyun burada görünür)</b>Butonlara dokun, tuşlar yukarıda yazar</div></div>
<div id="log"></div>
<div id="modbtn">MOD</div>

<div id="mv">
  <div class="btn" id="lf"><svg viewBox="0 0 24 24"><path d="M12 4l9 14H3z"/></svg></div>
  <div class="btn" id="rt"><svg viewBox="0 0 24 24"><path d="M12 4l9 14H3z"/></svg></div>
</div>
<div class="btn" id="dn" data-key="down"><svg viewBox="0 0 24 24"><path d="M12 4l9 14H3z"/></svg></div>

<div class="btn" id="jump" data-key="up"><span class="k">↑</span><svg viewBox="0 0 24 24"><path d="M12 3l9 10h-5v8H8v-8H3z"/></svg>ZIPLA</div>
<div class="btn" id="dyn" data-key="x"><span class="k">X</span><svg viewBox="0 0 24 24"><rect x="9" y="8" width="6" height="14" rx="1.5"/><rect x="9" y="11" width="6" height="2" fill="#c1121f"/><rect x="9" y="16" width="6" height="2" fill="#c1121f"/><path d="M12 8c0-3 3-2 4-5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>DİNAMİT</div>
<div class="btn" id="fire" data-key="z"><span class="k">Z</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-width="1.8"/></svg>ATEŞ</div>

<script src="ruffle.js" onerror="void 0"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("jump") === "left") document.body.classList.add("jl");
  const RATIO = parseFloat(q.get("ratio")) || 2.0;   // 1.5 = orijinal oran, büyüdükçe geniş ve gerilmiş görünür

  const KEYS = {
    left:{key:"ArrowLeft",code:"ArrowLeft",kc:37}, up:{key:"ArrowUp",code:"ArrowUp",kc:38},
    right:{key:"ArrowRight",code:"ArrowRight",kc:39}, down:{key:"ArrowDown",code:"ArrowDown",kc:40},
    z:{key:"z",code:"KeyZ",kc:90}, x:{key:"x",code:"KeyX",kc:88},
    ins:{key:"Insert",code:"Insert",kc:45}, del:{key:"Delete",code:"Delete",kc:46} };
  let player = null;
  const gameBox = document.getElementById("game"), logEl = document.getElementById("log");
  try {
    const ruffle = window.RufflePlayer.newest();
    player = ruffle.createPlayer();
    player.config = { letterbox:"on", unmuteOverlay:"hidden", splashScreen:false, contextMenu:"off",
                      scale:"exactFit", forceScale:true, forceAlign:true, quality:"high" };
    gameBox.appendChild(player); player.load("game.swf");
  } catch (e) {                                   // ruffle yoksa sadece düzen önizlemesi
    document.getElementById("demo").style.display = "flex"; logEl.style.display = "block"; logEl.textContent = "tuş: -";
  }
  function fit() {
    const w = Math.min(window.innerWidth, window.innerHeight * RATIO);
    gameBox.style.width = w + "px"; gameBox.style.left = ((window.innerWidth - w) / 2) + "px";
  }
  addEventListener("resize", fit); fit();

  const held = {};
  function setKey(n, on) {
    if (!!held[n] === on) return; held[n] = on;
    const k = KEYS[n];
    if (player) {
      const e = new KeyboardEvent(on ? "keydown" : "keyup", { key:k.key, code:k.code, keyCode:k.kc, which:k.kc, bubbles:true, cancelable:true });
      Object.defineProperty(e, "keyCode", { get:()=>k.kc }); Object.defineProperty(e, "which", { get:()=>k.kc });
      player.dispatchEvent(e);
    }
    if (on && navigator.vibrate) navigator.vibrate(10);
    if (!player) logEl.textContent = "tuş: " + (Object.keys(held).filter(x=>held[x]).join(" + ") || "-");
  }
  const releaseAll = () => Object.keys(held).forEach(n => setKey(n, false));
  addEventListener("blur", releaseAll);
  document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
  document.addEventListener("contextmenu", e => e.preventDefault());

  // ◀ ▶ şeridi: sadece şeridin içi/hemen yakını tepki verir, kaydırarak yön değişir
  const mv = document.getElementById("mv"), lf = document.getElementById("lf"), rt = document.getElementById("rt");
  let mvPtr = null;
  function mvUpdate(e) {
    const r = mv.getBoundingClientRect(), m = 24;
    const inside = e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - m && e.clientY < r.bottom + m;
    const mid = r.left + r.width / 2;
    const L = inside && e.clientX < mid - 4, R = inside && e.clientX > mid + 4;
    setKey("left", L); setKey("right", R); lf.classList.toggle("on", L); rt.classList.toggle("on", R);
  }
  mv.addEventListener("pointerdown", e => { e.preventDefault(); if (mvPtr !== null) return; mvPtr = e.pointerId; mv.setPointerCapture(mvPtr); mvUpdate(e); });
  mv.addEventListener("pointermove", e => { if (e.pointerId === mvPtr) mvUpdate(e); });
  ["pointerup","pointercancel","lostpointercapture"].forEach(t => mv.addEventListener(t, e => {
    if (e.pointerId !== mvPtr) return; mvPtr = null; setKey("left", false); setKey("right", false); lf.classList.remove("on"); rt.classList.remove("on"); }));

  // Tek tuşlar: basılı tuttukça tuş basılı (Z sürekli ateş)
  document.querySelectorAll("[data-key]").forEach(b => {
    let pid = null; const n = b.dataset.key;
    b.addEventListener("pointerdown", e => { e.preventDefault(); if (pid !== null) return; pid = e.pointerId; b.setPointerCapture(pid); b.classList.add("on"); setKey(n, true); });
    ["pointerup","pointercancel","lostpointercapture"].forEach(t => b.addEventListener(t, e => {
      if (e.pointerId !== pid) return; pid = null; b.classList.remove("on"); setKey(n, false); }));
  });
  // MOD menü: Insert = aç, Delete = kapat (oyun içindeki menüye klavye olayı gönderir)
  const modbtn = document.getElementById("modbtn");
  let modOpen = false;
  function tap(n) { setKey(n, true); setTimeout(() => setKey(n, false), 60); }
  modbtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    releaseAll();
    modOpen = !modOpen;
    document.body.classList.toggle("modopen", modOpen);
    modbtn.classList.toggle("on", modOpen);
    modbtn.textContent = modOpen ? "KAPAT" : "MOD";
    tap(modOpen ? "ins" : "del");
  });
</script>
</body>
</html>
