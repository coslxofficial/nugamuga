<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gun Mayhem 2</title>
<style>
  :root { --size: clamp(160px, 36vh, 220px); }
  html, body { 
    margin:0; height:100%; background:#121214; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none;
    -webkit-tap-highlight-color:transparent; 
    font-family:system-ui, -apple-system, sans-serif; 
  }
  #game { position:absolute; top:0; bottom:0; left:0; width:100%; }
  #game ruffle-player, #game ruffle-embed { width:100%; height:100%; }

  /* ---------- Yön Tuşları (4-Yön Grid) ---------- */
  #dpad-container {
    position:absolute; z-index:10; touch-action:none;
    left:calc(env(safe-area-inset-left,0px) + 20px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    width:var(--size); height:var(--size);
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
  }

  .btn-dir {
    background: radial-gradient(circle at 35% 30%, #3a4b5c, #1e2836);
    border: 3px solid #0f151d;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #41b8d5;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.2), 0 6px 0 #0f151d, 0 10px 15px rgba(0,0,0,0.6);
    transition: transform 0.05s, box-shadow 0.05s;
    cursor: pointer;
  }

  .btn-dir svg {
    width: 55%; height: 55%;
    fill: currentColor;
    filter: drop-shadow(0 2px 0 #0f151d);
  }

  .btn-dir.up { grid-column: 2; grid-row: 1; }
  .btn-dir.lf { grid-column: 1; grid-row: 2; }
  .btn-dir.rt { grid-column: 3; grid-row: 2; }
  .btn-dir.dn { grid-column: 2; grid-row: 3; }

  .btn-dir.dn svg { transform: rotate(180deg); }
  .btn-dir.lf svg { transform: rotate(-90deg); }
  .btn-dir.rt svg { transform: rotate(90deg); }

  .btn-dir.on {
    transform: translateY(4px);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.2), 0 2px 0 #0f151d, 0 4px 8px rgba(0,0,0,0.6);
    color: #6ee7b7;
  }

  /* ---------- Aksiyon Butonları (Sadece X ve Z Harfleri) ---------- */
  .act-container {
    position: absolute; z-index: 10; touch-action: none;
    right: calc(env(safe-area-inset-right,0px) + 20px);
    bottom: calc(env(safe-area-inset-bottom,0px) + 20px);
    display: flex; gap: 16px; align-items: flex-end;
  }

  .act {
    position: relative; touch-action: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: calc(var(--size) * 0.28);
    text-shadow: 0 3px 0 rgba(0,0,0,0.6);
    transition: transform 0.05s ease, box-shadow 0.05s ease;
    cursor: pointer;
  }

  /* --- DİNAMİT BUTONU (X) --- */
  #dyn {
    width: calc(var(--size) * 0.58);
    height: calc(var(--size) * 0.58);
    background: radial-gradient(circle at 40% 30%, #ff8343 0%, #e63928 65%, #91160b 100%);
    border: 5px solid #851e11;
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.3), inset 0 -5px 12px rgba(0,0,0,0.5), 0 8px 0 #4a0f08, 0 12px 20px rgba(0,0,0,0.6);
  }

  #dyn.on {
    transform: translateY(5px);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -3px 8px rgba(0,0,0,0.5), 0 3px 0 #4a0f08, 0 5px 10px rgba(0,0,0,0.6);
  }

  /* --- ATEŞ BUTONU (Z) --- */
  #fire {
    width: calc(var(--size) * 0.68);
    height: calc(var(--size) * 0.68);
    background: radial-gradient(circle at 40% 30%, #54d3e8 0%, #2b8cb8 65%, #134e6b 100%);
    border: 5px solid #144961;
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.35), inset 0 -5px 12px rgba(0,0,0,0.5), 0 8px 0 #0a2734, 0 12px 20px rgba(0,0,0,0.6);
  }

  #fire.on {
    transform: translateY(5px);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -3px 8px rgba(0,0,0,0.5), 0 3px 0 #0a2734, 0 5px 10px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<div id="game"></div>

<!-- Yön Butonları -->
<div id="dpad-container">
  <div class="btn-dir up" data-key="up">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 12h-5v6h-6v-6h-5z" stroke="#0f151d" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
  <div class="btn-dir lf" data-key="left">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 12h-5v6h-6v-6h-5z" stroke="#0f151d" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
  <div class="btn-dir rt" data-key="right">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 12h-5v6h-6v-6h-5z" stroke="#0f151d" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
  <div class="btn-dir dn" data-key="down">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 12h-5v6h-6v-6h-5z" stroke="#0f151d" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </div>
</div>

<!-- Aksiyon Butonları (Sadece X ve Z) -->
<div class="act-container">
  <div class="act" id="dyn" data-key="x">X</div>
  <div class="act" id="fire" data-key="z">Z</div>
</div>

<script src="ruffle.js"></script>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.config = { letterbox: "on", unmuteOverlay: "hidden", splashScreen: false,
                    contextMenu: "off", scale: "exactFit", forceScale: true, forceAlign: true, quality: "high" };

  const RATIO = 1.5;
  const gameBox = document.getElementById("game");
  function fit() {
    const w = Math.min(window.innerWidth, window.innerHeight * RATIO);
    gameBox.style.width = w + "px";
    gameBox.style.left = ((window.innerWidth - w) / 2) + "px";
  }
  window.addEventListener("resize", fit); fit();
  gameBox.appendChild(player);
  player.load("game.swf");

  /* ---------- Tuş Kontrolleri ---------- */
  const KEYS = {
    left:  { key:"ArrowLeft",  code:"ArrowLeft",  kc:37 },
    up:    { key:"ArrowUp",    code:"ArrowUp",    kc:38 },
    right: { key:"ArrowRight", code:"ArrowRight", kc:39 },
    down:  { key:"ArrowDown",  code:"ArrowDown",  kc:40 },
    z:     { key:"z",          code:"KeyZ",       kc:90 },
    x:     { key:"x",          code:"KeyX",       kc:88 }
  };
  const held = {};

  function send(type, name) {
    const k = KEYS[name];
    if (!k) return;
    const e = new KeyboardEvent(type, { key:k.key, code:k.code, keyCode:k.kc, which:k.kc,
                                        bubbles:true, cancelable:true });
    Object.defineProperty(e, "keyCode", { get:()=>k.kc });
    Object.defineProperty(e, "which",   { get:()=>k.kc });
    player.dispatchEvent(e);
  }

  function setKey(name, on) {
    if (!!held[name] === on) return;
    held[name] = on;
    send(on ? "keydown" : "keyup", name);
    if (on && navigator.vibrate) navigator.vibrate(10);
  }

  function releaseAll() { Object.keys(held).forEach(n => setKey(n, false)); }
  window.addEventListener("blur", releaseAll);
  document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

  /* ---------- Dokunmatik Etkileşimler ---------- */
  const allButtons = document.querySelectorAll(".btn-dir, .act");

  allButtons.forEach(btn => {
    const keyName = btn.dataset.key;
    let activePointerId = null;

    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      btn.setPointerCapture(e.pointerId);
      btn.classList.add("on");
      setKey(keyName, true);
    });

    const handleRelease = e => {
      if (e.pointerId !== activePointerId) return;
      activePointerId = null;
      btn.classList.remove("on");
      setKey(keyName, false);
    };

    ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
      btn.addEventListener(type, handleRelease);
    });
  });

  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
