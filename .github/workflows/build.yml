name: APK derle
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Web dosyalarini hazirla
        run: |
          mkdir www
          cp index.html game.swf ruffle.js *.wasm core.ruffle.*.js www/
      - name: Capacitor kur
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Yatay mod
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GunMayhem2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
